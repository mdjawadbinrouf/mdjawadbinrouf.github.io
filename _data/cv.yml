          - Teach undergraduate courses across the industrial and production engineering curriculum, including lesson planning, assignments, assessment and progress tracking.
          - Contribute to curriculum development aligned with Outcome-Based Education (OBE) and to laboratory improvement initiatives.

      - company: Ahsanullah University of Science and Technology
        position: Research Assistant, Industrial and Production Engineering
        location: Dhaka, Bangladesh
        start_date: 2024-04
        end_date: 2025-06
        summary: "Project: Enhancing Occupational Safety and Ergonomics in Bangladesh's Ready-Made Garments (RMG) Industry: Multisensory Workload Analysis with Machine Learning. Principal Investigator: Mr. Shah Murtoza Morshed."
        highlights:
          - Conducted RMG factory visits, coordinated with industry stakeholders, and collected real-time workload and ergonomic data.
          - Set up and maintained multisensory acquisition systems and analyzed ECG, EMG, EDA and EEG signals from garment-packaging tasks.
          - Contributed to ML model development for workload classification, evaluated with leave-one-subject-out cross-validation.

